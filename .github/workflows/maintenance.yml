name: Maintenance

# The jobs that keep a free-tier deployment honest. All of them are safe to
# run late, safe to run twice, and no-op without their secrets — GitHub drops
# scheduled runs under load and never retries them, so anything here that
# needed to run exactly once would eventually not run at all.
on:
  schedule:
    # 02:10 UTC — 08:10 in Dhaka, after the overnight and before the clinic
    # opens, so a downgrade or a prune never lands mid-surgery-list.
    - cron: "10 2 * * *"
  workflow_dispatch:

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly housekeeping
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets exist
        id: config
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL and CRON_SECRET are not set, so housekeeping is not scheduled yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run it
        if: steps.config.outputs.ready == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$APP_URL/api/v1/cron/maintenance" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "content-type: application/json"
