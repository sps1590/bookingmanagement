name: Notifications

# Every ten minutes. The queue holds confirmations, which want to arrive
# promptly, and 24h/1h reminders, where ten minutes of slack is invisible.
#
# This is a scheduled GitHub Action rather than pg_cron calling out through
# pg_net, for one reason: this is free, it is visible in the Actions tab when
# it fails, and it is already how this project keeps its database awake.
# Wiring the database to call back into Vercel adds a moving part whose
# failures are invisible from both ends.
#
# GitHub drops scheduled runs under load and does not retry them, so the
# worker must be safe to run late and safe to run twice. It is: claiming is
# atomic (defect B-16) and anything abandoned mid-send is reaped after ten
# minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  dispatch:
    name: Send what is due
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets exist
        id: config
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL and CRON_SECRET are not set, so nothing is scheduled yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch
        if: steps.config.outputs.ready == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # --fail-with-body so a non-2xx both fails the step and shows why.
          # The secret goes in a header, never a query string: URLs end up in
          # access logs and this one drains the queue.
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST "$APP_URL/api/v1/cron/notifications" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "content-type: application/json"
