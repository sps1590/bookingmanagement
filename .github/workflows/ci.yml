name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders. No stage below talks to a real Supabase project: the database
  # job uses a throwaway Postgres service container, and the routes the E2E
  # suite visits do not call Supabase. Shaped like real values because
  # lib/env.ts validates them at boot and a malformed URL fails the build.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_APP_URL: http://localhost:3100
  LOG_LEVEL: error

jobs:
  static:
    name: Lint, format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Audit (fail on high)
        run: npm audit --audit-level=high

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test -- --reporter=default

  database:
    name: Migrations & RLS tests
    runs-on: ubuntu-latest

    # A plain Postgres, not the Supabase stack. scripts/sql/supabase-shim.sql
    # supplies the four things the schema needs from Supabase — auth.users,
    # auth.uid(), the three roles, and Supabase's open default grants — so the
    # whole schema and every policy can be built and tested here. No Docker on
    # anyone's laptop, and no shared hosted project for CI to fight over.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Builds the schema from nothing and then asserts against it. This is
      # what proves the migration chain still applies in order from an empty
      # database — the guarantee `supabase db reset` used to provide.
      - name: Build schema from zero and run RLS suite
        run: npm run test:db:fresh

      # Phase 2's exit gate. Separate from the suite above because it needs
      # committed rows on several connections at once: two sessions can only
      # race for a slot if both are really committing, and tests/db runs
      # everything inside one transaction that is rolled back.
      #
      # Three passes rather than one: a race that is only sometimes lost is
      # the failure mode here, and a single green pass proves very little.
      # The plan's sign-off gate is ten; three is what CI pays for on every
      # push.
      - name: Concurrency suite
        run: npm run test:concurrency -- --repeat 3

      - name: Check generated types are current
        run: |
          npx tsx scripts/gen-types.ts /tmp/types.ts
          if ! diff -q /tmp/types.ts lib/supabase/types.ts; then
            echo "::error::lib/supabase/types.ts is stale. Run 'npm run db:types' and commit the result."
            diff /tmp/types.ts lib/supabase/types.ts || true
            exit 1
          fi

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
